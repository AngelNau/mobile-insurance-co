# Fixed project name, so containers/volumes aren't named after the checkout directory.
name: claims-agent

services:
  ollama:
    # Same Ollama version the evaluation in eval_results.md was run with.
    image: ollama/ollama:0.40.11
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Uncomment to use an NVIDIA GPU (needs nvidia-container-toolkit on the host).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: downloads the model into the ollama volume (a no-op once it is cached).
  ollama-pull:
    image: ollama/ollama:0.40.11
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2"]
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    environment:
      # Read by the ollama client that langchain-ollama uses.
      OLLAMA_HOST: http://ollama:11434
    # The project dir is mounted so eval_results.md / agent_graph.png (and .env for --remote) are shared with the host.
    volumes:
      - .:/app
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama:
